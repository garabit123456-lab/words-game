<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Слова из Букв: Кроссворды</title>
    <link rel="stylesheet" href="style.css">
    <!-- Официальный SDK Яндекс Игр v2 -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
    <div id="game-container">
        <!-- Холст для салюта / конфетти -->
        <canvas id="confetti-canvas"></canvas>

        <!-- Верхняя шапка -->
        <header class="header-bar">
            <div class="header-left">
                <button class="sound-toggle-btn" id="sound-btn" title="Звук">🔊</button>
                <div class="level-info-col">
                    <div class="level-title" id="level-title">Уровень 1</div>
                    <div class="location-badge" id="location-badge">📍 Уютный домик</div>
                </div>
            </div>
            <div class="coins-display">
                <span class="coin-icon">💰</span>
                <span id="coins-count">100</span>
            </div>
        </header>

        <!-- Область сетки кроссворда -->
        <main class="crossword-container">
            <div class="crossword-grid" id="crossword-grid"></div>
        </main>

        <!-- Превью составляемого слова -->
        <div class="word-preview-box" id="word-preview"></div>

        <!-- Нижний блок: круг букв и кнопки действий -->
        <section class="wheel-section">
            <div class="side-controls">
                <!-- Кнопка перемешивания букв -->
                <button class="action-btn" id="shuffle-btn" title="Перемешать">
                    🔄
                </button>

                <!-- Кнопка подсказки (Лампочка) -->
                <button class="action-btn" id="hint-btn" title="Подсказка буквы">
                    💡
                    <span class="btn-badge">50</span>
                </button>
            </div>

            <!-- Интерактивный круг -->
            <div class="wheel-container" id="wheel-container">
                <canvas id="wheel-canvas"></canvas>
            </div>
        </section>

        <!-- Модалка победы на уровне: Коллекционная открытка локации -->
        <div class="modal-overlay" id="win-modal">
            <div class="modal-card postcard-modal">
                <div class="modal-title">🎉 Уровень пройден!</div>
                
                <!-- Карточка открытого места -->
                <div class="postcard-card" id="postcard-card">
                    <div class="postcard-icon" id="postcard-icon">🏞️</div>
                    <div class="postcard-name" id="postcard-name">Озеро Байкал</div>
                    <div class="postcard-fact" id="postcard-fact">Глубочайшее озеро планеты с чистейшей пресной водой.</div>
                </div>

                <div class="reward-pill">+25 💰 Награда</div>
                <button class="modal-btn" id="next-level-btn">Следующее место ➔</button>
            </div>
        </div>

        <!-- Модалка просмотра рекламы за подсказку -->
        <div class="modal-overlay" id="hint-modal">
            <div class="modal-card">
                <div class="modal-title">💡 Нужна подсказка?</div>
                <div class="modal-text">У вас недостаточно монет (требуется 50). Посмотрите короткий рекламный ролик, чтобы открыть одну букву бесплатно!</div>
                <button class="modal-btn" id="watch-ad-hint-btn">🎬 Смотреть рекламу</button>
                <button class="modal-btn secondary" id="cancel-hint-btn">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Скрипты игры -->
    <script src="levels.js"></script>
    <script src="vk-sdk.js"></script>
    <script src="game.js"></script>
</body>
</html>
